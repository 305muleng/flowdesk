spring.application.name=flowdesk

spring.datasource.url=jdbc:mysql://localhost:3306/flowdesk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${FLOWDESK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

invitation.expire-days=7
member-leave.expire-days=7
project-manager-transfer.expire-days=3
# Redis 连接配置
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# 试验性的延迟时间：10 秒
flowdesk.cache.task-summary.second-delete-delay-ms=10000
# 提醒模块须先执行迁移再显式启用；关闭时不访问提醒表或队列。
flowdesk.reminders.enabled=${FLOWDESK_REMINDERS_ENABLED:false}
