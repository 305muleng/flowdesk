name: flowdesk
services:
  web:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "127.0.0.1:${FLOWDESK_WEB_PORT:-8088}:80"
    environment:
      FLOWDESK_BACKEND: "${FLOWDESK_BACKEND:-http://host.docker.internal:8080}"
      NGINX_ENVSUBST_FILTER: "FLOWDESK_BACKEND"
    extra_hosts:
      - "host.docker.internal:host-gateway"
