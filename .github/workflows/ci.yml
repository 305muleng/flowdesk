name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端普通测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 官方 checkout v7 固定提交
        with:
          persist-credentials: false
      - name: 配置 Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # 官方 setup-java v6 固定提交
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 运行不依赖外部服务的测试
        # 显式使用脚本解释器，无需修改仓库中 mvnw 的文件权限。
        run: bash ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 官方 checkout v7 固定提交
        with:
          persist-credentials: false
      - name: 配置 Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 官方 setup-node v7 固定提交
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 按锁文件安装依赖
        run: npm ci
      - name: 运行前端测试
        run: node --test tests/*.test.cjs
      - name: 类型检查与生产构建
        run: npm run build
